<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Studio — Irina AI Studio</title><style>*{box-sizing:border-box} :root{color-scheme:dark;--bg:#171326;--panel:#252039;--text:#f8fafc;--muted:#bcb4cf;--line:#403751;--accent:#a78bfa;--pink:#ec8ac4} :root.light{color-scheme:light;--bg:#f5f2fa;--panel:#fff;--text:#252039;--muted:#665d78;--line:#ded7eb;--accent:#7552cc;--pink:#a83c83}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Segoe UI',system-ui,sans-serif}aside{position:fixed;width:244px;inset:0 auto 0 0;background:var(--panel);border-right:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;font-size:19px;font-weight:750;letter-spacing:-.6px}.logo{display:grid;place-items:center;background:linear-gradient(135deg,#a78bfa,#ec8ac4);color:#211631;border-radius:13px;width:42px;height:42px;font-size:28px}small{display:block;color:var(--muted);font-size:11px;letter-spacing:.5px;font-weight:400}nav{display:grid;gap:8px;margin-top:48px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 15px;transition:transform .15s,background .15s}button:hover{transform:translateY(-1px);border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}nav button{text-align:left;border-color:transparent;color:var(--muted)}nav button.active{background:color-mix(in srgb,var(--accent) 18%,var(--panel));color:var(--accent)}footer{margin-top:auto;color:var(--muted);font-size:11px;letter-spacing:2px}main{margin-left:244px;padding:26px 36px;max-width:1600px}header,.between{display:flex;align-items:center;justify-content:space-between;gap:12px}header{color:var(--muted);margin-bottom:28px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,4vw,38px);letter-spacing:-1.3px}h2{font-size:19px}h3{font-size:16px}p{color:var(--muted)}.hero{padding:30px;background:linear-gradient(120deg,#39285c,#482b50);color:#fff;border:1px solid #76548b;border-radius:22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero p{color:#e0d5f4;margin-top:8px}.eyebrow{color:#e8b8ff;font-size:11px;letter-spacing:2px;font-weight:700}.primary{background:linear-gradient(110deg,#a78bfa,#ec8ac4);color:#211631;border:0;font-weight:750;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.panel,.stat{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px}.stat b{display:block;font-size:32px;margin:8px 0;color:var(--accent)}.stat span,.muted{color:var(--muted);font-size:13px}.columns{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;margin-top:20px}.progress{height:10px;background:var(--line);border-radius:20px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,#a78bfa,#ec8ac4);border-radius:20px}.post{padding:15px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.post:last-child{border:0}.post h3{overflow-wrap:anywhere}.tag{display:inline-block;border-radius:20px;padding:4px 9px;background:color-mix(in srgb,var(--accent) 17%,var(--panel));color:var(--accent);font-size:11px;white-space:nowrap}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{padding:6px 10px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px}.day{min-height:65px;padding:7px;text-align:left;overflow:hidden;white-space:normal}.day.today{border-color:var(--pink)}.day.has{background:color-mix(in srgb,var(--accent) 15%,var(--panel))}.day small{color:var(--accent);overflow-wrap:anywhere}.weekday{text-align:center;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px}textarea{resize:vertical}.toolbar input,.toolbar select{width:auto;max-width:100%}.toolbar input{flex:1;min-width:160px}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:20px;width:min(540px,94vw);max-height:92vh;padding:24px}dialog::backdrop{background:#100b1dc9;backdrop-filter:blur(4px)}form{display:grid;gap:13px}label{display:grid;gap:5px;color:var(--muted);font-size:13px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}#toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border-radius:10px;padding:12px;box-shadow:0 5px 30px #0004;display:none;z-index:5}.empty{padding:24px 0;color:var(--muted)}.ideaGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:20px}.ideaGrid p{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}.sectionTitle{margin-bottom:15px}@media(max-width:1050px){.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{position:static;width:auto;padding:15px}nav{display:flex;overflow:auto;margin-top:15px;gap:4px}nav button{white-space:nowrap;padding:9px}footer{display:none}main{margin:0;padding:16px}.hero{align-items:flex-start;flex-direction:column;padding:22px}.stats{gap:8px}.stat,.panel{padding:13px}.day{min-height:49px;padding:4px}.post{flex-wrap:wrap}header{margin-bottom:15px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><aside><div class="brand"><span class="logo">✦</span><div>Content Studio<small>Plan. Create. Inspire.</small></div></div><nav aria-label="Навигация"><button data-page="home">◈　Главная</button><button data-page="calendar">▦　Календарь</button><button data-page="posts">▤　Публикации</button><button data-page="ideas">✧　Банк идей</button><button data-page="settings">⚙　Настройки</button></nav><footer>✦ IRINA AI STUDIO</footer></aside><main><header><span id="crumb">Рабочее пространство</span><button id="theme" aria-label="Переключить тему">☼ Тема</button></header><section id="view"></section></main><dialog id="editor"><form id="form"><div class="between"><h2 id="dialogTitle">Публикация</h2><button type="button" id="close" aria-label="Закрыть">×</button></div><label>Название<input name="title" required maxlength="150"></label><label>Текст<textarea name="text" rows="5"></textarea></label><div class="pair"><label>Дата<input name="date" type="date" required></label><label>Время<input name="time" type="time" required></label></div><div class="pair"><label>Социальная сеть<select name="network"><option>Telegram</option><option>VK</option><option>Instagram</option><option>YouTube</option><option>Другое</option></select></label><label>Рубрика<input name="category" placeholder="Например, экспертная"></label></div><label>Статус<select name="status"><option>Идея</option><option>В работе</option><option>Готово</option><option>Опубликовано</option></select></label><button class="primary" type="submit">Сохранить публикацию</button></form></dialog><div id="toast" role="status"></div><script>'use strict';
const $=s=>document.querySelector(s), view=$('#view'), form=$('#form'), dialog=$('#editor');
const statuses=['Идея','В работе','Готово','Опубликовано'], networks=['Telegram','VK','Instagram','YouTube','Другое'];
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const offset=n=>{let d=new Date();d.setDate(d.getDate()+n);return dateKey(d)};
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const demo=[['Знакомство с брендом','Расскажите историю своего проекта.',-2,'Telegram','Имидж','Опубликовано'],['5 идей для продуктивного утра','Подготовить полезную подборку.',0,'VK','Польза','Готово'],['Закулисье творческого процесса','Снять короткое видео о рабочем дне.',2,'Instagram','Лайфстайл','В работе'],['Тренды контента','Собрать примеры и референсы.',4,'Telegram','Экспертная','Идея'],['Ответы на вопросы подписчиков','Собрать вопросы аудитории.',6,'YouTube','Вовлечение','Готово']].map(([title,text,n,network,category,status])=>({id:uid(),title,text,date:offset(n),time:'12:00',network,category,status}));
function load(k,fallback){try{let v=localStorage.getItem(k);return v===null?fallback:JSON.parse(v)}catch{return fallback}}
let posts=load('cs.posts.v1',demo), theme=load('cs.theme.v1','dark'), page='home', month=new Date(), selected='', editing=null, query='', filter='', networkFilter='', timer;
if(!Array.isArray(posts))posts=demo;
function save(){try{localStorage.setItem('cs.posts.v1',JSON.stringify(posts));localStorage.setItem('cs.theme.v1',JSON.stringify(theme));return true}catch{notify('Не удалось сохранить данные в браузере');return false}}
function notify(t){let el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(timer);timer=setTimeout(()=>el.style.display='none',3500)}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const sorted=a=>[...a].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const btn=(action,label,id='')=>`<button data-action="${action}" data-id="${esc(id)}">${label}</button>`;
const add=(label='＋ Создать публикацию')=>`<button class="primary" data-action="add">${label}</button>`;
function rows(a){return a.length?sorted(a).map(p=>`<article class="post"><div><h3>${esc(p.title)}</h3><p class="muted">${fmt(p.date)} · ${esc(p.time)} · ${esc(p.network)} · ${esc(p.category)}</p></div><span class="tag">${esc(p.status)}</span><div class="actions">${btn('edit','✎ Изменить',p.id)}${btn('delete','Удалить',p.id)}</div></article>`).join(''):'<p class="empty">Здесь пока нет публикаций.</p>'}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();return `<div class="between"><h2>${month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h2><div class="actions">${btn('prev','‹')}${btn('next','›')}</div></div><div class="cal">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="weekday">${d}</span>`).join('')}${'<span></span>'.repeat(first)}${Array.from({length:n},(_,i)=>{let d=dateKey(new Date(y,m,i+1)),a=posts.filter(p=>p.date===d);return `<button class="day ${a.length?'has':''} ${d===offset(0)?'today':''}" data-action="day" data-id="${d}" aria-label="${d}, публикаций: ${a.length}">${i+1}${a.length?`<small>● ${a.length}</small>`:''}</button>`}).join('')}</div>${selected?`<div style="margin-top:18px"><div class="between"><h3>${fmt(selected)}</h3>${btn('addDay','＋ Добавить',selected)}</div>${rows(posts.filter(p=>p.date===selected))}</div>`:''}`}
function render(){document.documentElement.classList.toggle('light',theme==='light');document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#crumb').textContent=({home:'Обзор / Рабочее пространство',calendar:'Календарь',posts:'Публикации',ideas:'Банк идей',settings:'Настройки'})[page];let done=posts.filter(p=>p.status==='Опубликовано').length, ready=posts.filter(p=>p.status==='Готово').length, pct=posts.length?Math.round(done/posts.length*100):0;
if(page==='home')view.innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR CREATIVE SPACE</div><h1>Время создавать ✦</h1><p>Планируйте контент, воплощайте идеи и вдохновляйте аудиторию.</p></div>${add()}</div><div class="stats">${[['Всего публикаций',posts.length,'Ваш контент-план'],['В работе',posts.filter(p=>p.status==='В работе').length,'Творческий процесс'],['Готово',ready,'Ожидают выхода'],['Опубликовано',done,'Уже в эфире']].map(([t,n,s])=>`<div class="stat"><span>${t}</span><b>${n}</b><span>${s}</span></div>`).join('')}</div><div class="panel"><div class="between"><h2>Прогресс контент-плана</h2><strong>${pct}%</strong></div><div class="progress" role="progressbar" aria-label="Опубликовано" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><p>${done} из ${posts.length} публикаций опубликовано</p></div><div class="columns"><div class="panel"><h2>Ближайшие публикации</h2>${rows(sorted(posts.filter(p=>p.date>=offset(0)&&p.status!=='Опубликовано')).slice(0,4))}</div><div class="panel">${calendar()}</div></div>`;
if(page==='calendar')view.innerHTML=`<div class="between sectionTitle"><h1>Календарь контента</h1>${add()}</div><div class="panel">${calendar()}</div>`;
if(page==='posts'){view.innerHTML=`<div class="between"><h1>Публикации</h1>${add()}</div><div class="toolbar"><input id="search" aria-label="Поиск" placeholder="Поиск публикаций…" value="${esc(query)}"><select id="filter" aria-label="Статус"><option value="">Все статусы</option>${statuses.map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select><select id="networkFilter" aria-label="Социальная сеть"><option value="">Все соцсети</option>${networks.map(s=>`<option ${s===networkFilter?'selected':''}>${s}</option>`).join('')}</select></div><div class="panel" id="results"></div>`;filterRows();$('#search').oninput=e=>{query=e.target.value;filterRows()};$('#filter').onchange=e=>{filter=e.target.value;filterRows()};$('#networkFilter').onchange=e=>{networkFilter=e.target.value;filterRows()}}
if(page==='ideas')view.innerHTML=`<div class="between"><h1>Банк идей</h1><button class="primary" data-action="addIdea">＋ Новая идея</button></div><p>Сохраняйте вдохновение и превращайте идеи в публикации.</p><div class="ideaGrid">${posts.filter(p=>p.status==='Идея').map(p=>`<article class="panel"><span class="tag">✧ Идея</span><h2>${esc(p.title)}</h2><p>${esc(p.text)}</p><div class="actions">${btn('edit','Изменить',p.id)}${btn('promote','В работу',p.id)}${btn('delete','Удалить',p.id)}</div></article>`).join('')||'<p class="empty">Добавьте первую идею.</p>'}</div>`;
if(page==='settings')view.innerHTML=`<h1 class="sectionTitle">Настройки</h1><div class="panel"><h2>Внешний вид</h2><p>Текущая тема: ${theme==='light'?'светлая':'тёмная'}</p><div class="actions" style="margin-top:15px">${btn('light','☼ Светлая')}${btn('dark','☾ Тёмная')}</div></div><div class="panel" style="margin-top:16px"><h2>Данные</h2><p>Публикации сохраняются локально в вашем браузере.</p><div class="actions" style="margin-top:15px">${btn('export','Скачать резервную копию')}${btn('clear','Удалить все публикации')}</div></div>`;}
function filterRows(){ $('#results').innerHTML=rows(posts.filter(p=>(!filter||p.status===filter)&&(!networkFilter||p.network===networkFilter)&&[p.title,p.text,p.category,p.network].join(' ').toLowerCase().includes(query.toLowerCase())))}
function openEditor(p=null,date=offset(0),idea=false){editing=p?.id||null;form.reset();let values=p||{title:'',text:'',date,time:'12:00',network:'Telegram',category:'',status:idea?'Идея':'В работе'};for(let [k,v] of Object.entries(values))if(form.elements.namedItem(k))form.elements.namedItem(k).value=v;$('#dialogTitle').textContent=p?'Редактировать публикацию':idea?'Новая идея':'Новая публикация';dialog.showModal();form.elements.title.focus()}
form.onsubmit=e=>{e.preventDefault();let p=Object.fromEntries(new FormData(form));p.title=p.title.trim();if(!p.title){form.elements.title.focus();return}p.id=editing||uid();posts=editing?posts.map(x=>x.id===editing?p:x):[...posts,p];dialog.close();if(save())notify('Публикация сохранена');render()};$('#close').onclick=()=>dialog.close();
function setTheme(t){theme=t;save();render()}
$('#theme').onclick=()=>setTheme(theme==='light'?'dark':'light');document.querySelector('nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;selected='';render()}};
view.onclick=e=>{let b=e.target.closest('[data-action]');if(!b)return;let {action,id}=b.dataset,p=posts.find(x=>x.id===id);switch(action){case 'add':openEditor();break;case 'addIdea':openEditor(null,offset(0),true);break;case 'addDay':openEditor(null,id);break;case 'edit':if(p)openEditor(p);break;case 'delete':if(p&&confirm('Удалить публикацию «'+p.title+'»?')){posts=posts.filter(x=>x.id!==id);if(save())notify('Публикация удалена');render()}break;case 'promote':if(p){p.status='В работе';if(save())notify('Идея перенесена в работу');render()}break;case 'prev':case 'next':month=new Date(month.getFullYear(),month.getMonth()+(action==='next'?1:-1),1);selected='';render();break;case 'day':selected=id;render();break;case 'light':case 'dark':setTheme(action);break;case 'clear':if(confirm('Удалить все публикации без возможности отмены?')){posts=[];save();render()}break;case 'export':{let u=URL.createObjectURL(new Blob([JSON.stringify(posts,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='content-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);break}}};
save();render();
</script></body></html>
